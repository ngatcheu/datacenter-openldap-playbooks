---
# -------------------------------------------------------
# Secrets OpenLDAP — Environnement Production
# Fichier à chiffrer avec : ansible-vault encrypt vars/secrets.yaml
# -------------------------------------------------------

# Mot de passe administrateur du serveur LDAP
ldap_bind_pw: "changeme"

# Mot de passe chiffré SSSD (généré via : slappasswd -s <motdepasse> | sss_obfuscate)
vault_openldap_obfuscated_password: "changeme"

# Mot de passe root OpenLDAP
vault_openldap_server_rootpw: "changeme"

# Mots de passe des utilisateurs
vault_user_fabrice_ngatcheu_password: "changeme"
